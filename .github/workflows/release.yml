name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  # id-token is required for cosign keyless (OIDC) signing of the release
  # checksums in .goreleaser.yaml. Without it, `cosign sign-blob` cannot obtain
  # a Fulcio certificate and the release step fails.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install gocyclo
        run: go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0

      - name: Install ineffassign
        run: go install github.com/gordonklaus/ineffassign@v0.2.0

      - name: Install misspell
        run: go install github.com/client9/misspell/cmd/misspell@v0.3.4

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run checks
        run: make ci

      # Fail the release if a known vulnerability is reachable from our code.
      # This is the same gate the `govulncheck` CI job runs on main, re-run
      # here so a vuln disclosed between the last main build and the tag still
      # blocks the release.
      - name: Run govulncheck
        run: govulncheck ./...

      - name: Ensure tag points to main
        run: |
          git fetch origin main
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          main_commit="$(git rev-parse origin/main)"
          if [ "$tag_commit" != "$main_commit" ]; then
            echo "tag commit ($tag_commit) does not match origin/main ($main_commit)"
            exit 1
          fi

      # GoReleaser's nix publisher needs `nix-hash` on PATH to compute the
      # source hash for the generated flake; without Nix it skips the nix pipe
      # ("nix-hash is not available"). Install Nix before the release step so the
      # flake is published to dirstral/nix-user-repository.
      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # cosign signs the release checksums (keyless / OIDC) — see `signs:` in
      # .goreleaser.yaml. Installs the `cosign` binary on PATH.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      # syft generates the per-archive SBOMs — see `sboms:` in
      # .goreleaser.yaml. Installs the `syft` binary on PATH.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: GoReleaser release
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # Required by the `nix:` publisher in .goreleaser.yaml to push the
          # generated flake to dirstral/nix-user-repository.
          NIX_USER_REPOSITORY_GITHUB_TOKEN: ${{ secrets.NIX_USER_REPOSITORY_GITHUB_TOKEN }}

      # GoReleaser auto-bumps the lean dir2mcp.rb but cannot regenerate
      # dir2mcp-full.rb (it carries hand-written docling install logic).
      # Open a PR on the tap that bumps version + tarball URLs + SHA256s
      # in dir2mcp-full.rb so the two formulas stay in lockstep.
      #
      # The step is idempotent so the workflow can be re-run for the same
      # tag (re-run from the Actions UI, retried after a transient
      # failure, or invoked twice while a tap CI re-run is pending):
      #   - if the bump branch already exists on the tap, we fetch and
      #     reset it to the new content rather than aborting on push;
      #   - if a PR for that branch is already open, we skip pr-create.
      - name: Bump dir2mcp-full formula on tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BRANCH="auto/bump-full-v${VERSION}"

          if [ ! -f dist/checksums.txt ]; then
            echo "dist/checksums.txt missing — GoReleaser dist artefacts not where expected" >&2
            exit 1
          fi

          # Configure git to authenticate via the gh credential helper rather
          # than embedding the token in the clone URL — a tokened remote URL
          # persists in the runner's .git/config for the life of the job.
          gh auth setup-git
          tap_dir="$RUNNER_TEMP/homebrew-tap"
          gh repo clone dirstral/homebrew-tap "$tap_dir"

          # Reuse the same identity GoReleaser uses for the lean-formula
          # commit so both updates show up under the same author.
          git -C "$tap_dir" config user.name "goreleaserbot"
          git -C "$tap_dir" config user.email "bot@goreleaser.com"

          # Re-use the existing remote branch when present so a re-run
          # updates it instead of failing on `git push` for a non-fast-
          # forward. The tap PR keeps the same head, so review history is
          # preserved.
          if git -C "$tap_dir" ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "branch $BRANCH already exists on tap; will update it"
            git -C "$tap_dir" fetch origin "$BRANCH":"$BRANCH"
            git -C "$tap_dir" checkout "$BRANCH"
          else
            git -C "$tap_dir" checkout -b "$BRANCH"
          fi

          python3 scripts/bump_full_formula.py \
            --version "$VERSION" \
            --checksums dist/checksums.txt \
            --formula "$tap_dir/Formula/dir2mcp-full.rb"

          if git -C "$tap_dir" diff --quiet -- Formula/dir2mcp-full.rb; then
            echo "no formula changes — branch already matches target state" >&2
            exit 0
          fi

          git -C "$tap_dir" add Formula/dir2mcp-full.rb
          git -C "$tap_dir" commit -m "Bump dir2mcp-full to v${VERSION} (automated)"
          # --force-with-lease is safe because we just fetched origin/$BRANCH
          # above (or just created the branch); it protects against pushing
          # over a concurrent human edit on the same branch.
          git -C "$tap_dir" push --force-with-lease origin "$BRANCH"

          # Skip pr-create when an open PR already exists for this branch.
          # gh pr list --json number returns "[]" when none match.
          existing_pr="$(gh pr list \
            --repo dirstral/homebrew-tap \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "PR #$existing_pr already open for $BRANCH; commit pushed, skipping pr-create"
            exit 0
          fi

          gh pr create \
            --repo dirstral/homebrew-tap \
            --base main \
            --head "$BRANCH" \
            --title "Bump dir2mcp-full to v${VERSION}" \
            --body "Automated bump from the dir2mcp v${VERSION} release.

          Mirrors the version, release-tarball URLs, and SHA256 fields in
          dir2mcp-full.rb without touching the docling install logic.
          Generated by .github/workflows/release.yml."
