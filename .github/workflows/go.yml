name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1

      - name: Install gocyclo
        run: go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0

      - name: Install ineffassign
        run: go install github.com/gordonklaus/ineffassign@v0.2.0

      - name: Install misspell
        run: go install github.com/client9/misspell/cmd/misspell@v0.3.4

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check
        run: make check

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # The race detector requires cgo; the rest of CI runs CGO_ENABLED=0.
      - name: Run tests under the race detector
        run: make test-race

  # Supply-chain gate: scan the module + reachable call graph for known
  # vulnerabilities (govulncheck reports only vulns actually reachable from
  # our code, so it is low-noise). Pinned to a fixed govulncheck version for
  # reproducibility; the vuln database itself is fetched fresh each run.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run govulncheck
        run: govulncheck ./...

  # The reference recognition backend (design 0004) is Python, so `go test`
  # never reaches it. Without this job a PR touching only annotator/ collected
  # a full set of green checks that had not executed a line of the change --
  # which is how an ungated precision regression shipped (#779/#787).
  annotator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # This job installs and runs repository-controlled Python, and has no
          # later authenticated git operation, so it has no use for the token
          # checkout otherwise leaves in .git/config.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: annotator/pyproject.toml

      - name: Run the annotator test suite
        run: make test-annotator

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Run conformance tests
        run: make conformance

  inspector-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Run inspector smoke test
        run: make inspector-smoke

  # Named, fast-failing coverage for the docling adapter contract and the
  # provider-selection / fallback decision matrix (#145). These cases also run
  # under `make check` (the `checks` job); this job runs them in isolation so an
  # adapter-protocol regression or a broken fallback path is surfaced as its own
  # red check rather than buried in the full suite. It needs no docling binary,
  # no docling-serve container, and no network (deterministic fakes/seams only).
  docling-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Docling adapter contract + provider-selection matrix
        run: >-
          go test -v ./tests/ingest/
          -run 'Docling|DescribeDocumentExtractor|DocumentExtractorFromConfig|DescribeAndBuild'
