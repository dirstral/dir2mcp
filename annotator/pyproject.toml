[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dirstral-annotator"
version = "0.2.0"
description = "Reference recognition backend for dir2mcp's recognize capability (dirstral-spec design 0004)"
requires-python = ">=3.11"
# Core (play-by-play recognizer, fusion, emitters, eval) is stdlib-only by
# design: the pilot's ground-truth path must run anywhere. Vision recognizers
# pull their stacks in via extras.
dependencies = []

[project.optional-dependencies]
ocr = ["pytesseract>=0.3", "Pillow>=10"]
face = ["insightface>=0.7", "opencv-python-headless>=4.9", "onnxruntime>=1.17"]
jersey = ["ultralytics>=8.2", "pytesseract>=0.3", "Pillow>=10"]
# Scene captioning (#860). torch is far heavier than insightface, so this extra
# is deliberately NOT part of `all`: pulling it in CI would add gigabytes for a
# recognizer whose absence already degrades through RecognizerUnavailable.
# transformers >= 4.57: the first release whose Auto* classes know model_type
# qwen3_vl (huggingface/transformers#40795). Below it AutoConfig raises a bare
# ValueError for the calibrated model; qwen_vl.MIN_TRANSFORMERS is the runtime
# half of the same floor, for a venv assembled without this extra.
caption = ["torch>=2.4", "transformers>=4.57", "accelerate>=1.0", "Pillow>=10"]
# Test runner + the schema-agreement contract test's validator. The tested
# code is stdlib-only; the runner and jsonschema are external test tooling.
test = ["pytest>=8", "jsonschema>=4"]
all = ["dirstral-annotator[ocr,face,jersey]"]

[project.scripts]
dirstral-annotate = "dirstral_annotator.cli:main"

[tool.setuptools.packages.find]
include = ["dirstral_annotator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
